# milhas-monitor — coleta promoções de milhas e preços de trechos, alerta no Telegram.
#
# Uso:
#   cp .env.example .env   # preencha os tokens
#   docker compose up -d --build
#
# O compose do OpenClaw (template genérico) não é alterado: este serviço entra na
# rede default do OpenClaw, que acessa a API em http://milhas:8000.
# Descubra o nome da rede com: docker network ls | grep openclaw

services:
  milhas:
    build:
      context: ./app
      dockerfile: Containerfile
    container_name: milhas
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - milhas_data:/data
      - ./app/config.yaml:/opt/app-root/src/config.yaml:ro
    # Só localhost da VPS, para depurar com curl. Nada exposto para a internet.
    ports:
      - "127.0.0.1:${MILHAS_HTTP_PORT:-8090}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [openclaw]

volumes:
  milhas_data:

networks:
  openclaw:
    name: ${OPENCLAW_NETWORK:-openclaw-milhas_default}
    external: true
